components:
  schemas:
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        quantity:
          type: integer
          example: 2
        priceAtOrder:
          type: number
          format: decimal
          description: The product's price captured at the time the order was placed.
          example: 29.99
        product:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: "Wireless Mouse"
            price:
              type: number
              format: decimal
              example: 29.99
            sku:
              type: string
              example: "WM-1001"
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, fulfilled, cancelled]
          example: "pending"
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              example: "John Doe"
            email:
              type: string
              format: email
              example: "john.doe@example.com"
        orderItems:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    CreateOrderInput:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          description: The line items to order. Stock is decremented for each product.
          items:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: string
                format: uuid
              quantity:
                type: integer
                minimum: 1
                example: 2
    UpdateOrderStatusInput:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, fulfilled, cancelled]
          example: "fulfilled"

paths:
  /api/orders/all:
    get:
      tags: [Orders]
      summary: List all orders
      description: Returns all orders newest first, optionally filtered by status. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, fulfilled, cancelled]
          description: Filter orders by status.
      responses:
        "200":
          description: A list of orders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "400":
          description: Bad request (invalid status filter)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "500":
          description: Internal server error
  /api/orders/create:
    post:
      tags: [Orders]
      summary: Create a new order
      description: >
        Creates an order for the authenticated user with status `pending`.
        Runs in a transaction: validates every product exists and has sufficient
        stock, records the price at order time, then decrements stock.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Bad request (e.g., validation error, insufficient stock for a product)
        "401":
          description: Missing or invalid authorization token
        "404":
          description: One or more products not found
        "500":
          description: Internal server error
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get an order by ID
      description: Returns a single order. Admins can view any order; other users can only view their own.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The order's UUID (OrderId property).
      responses:
        "200":
          description: The requested order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Bad request (invalid UUID)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (order belongs to another user)
        "404":
          description: Order not found
        "500":
          description: Internal server error
    delete:
      tags: [Orders]
      summary: Delete an order
      description: Deletes an order and its line items. Admin only. Note that stock is not restored.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The order's UUID.
      responses:
        "204":
          description: Order deleted successfully (no content)
        "400":
          description: Bad request (invalid UUID)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: Order not found
        "500":
          description: Internal server error
  /api/orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update an order's status
      description: Updates the status of an existing order. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The order's UUID (OrderId property)D.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusInput"
      responses:
        "200":
          description: Order status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/Order"
        "400":
          description: Bad request (status must be one of pending, fulfilled, or cancelled)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: Order not found
        "500":
          description: Internal server error
