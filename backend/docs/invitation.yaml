components:
  schemas:
    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        role:
          type: string
          enum: [admin, staff]
          example: "staff"
          description: The role assigned to the invited user.
        status:
          type: string
          enum: [pending, accepted, declined, revoked, expired]
          example: "pending"
        businessId:
          type: string
          format: uuid
        invitedById:
          type: string
          format: uuid
          description: ID of the user who sent the invitation.
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when the invitation expires.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SendInvitationInput:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: "john.doe@example.com"
          description: Email address of the person to invite.
        role:
          type: string
          enum: [admin, staff]
          example: "staff"
          description: Optional. Role to assign to the invited user. Defaults to `staff`.
    AcceptInvitationInput:
      type: object
      required:
        - name
        - password
      properties:
        name:
          type: string
          example: "John Doe"
          description: Full name of the new user.
        password:
          type: string
          minLength: 8
          description: >
            Password for the new account. Must be at least 8 characters and include
            a lowercase letter, an uppercase letter, a number, and a special character.
          example: "Password123!"
    DeclineInvitationInput:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          example: "abc123def456..."
          description: The unique invitation token provided in the invitation email.
    AcceptedInvitationResponse:
      type: object
      properties:
        message:
          type: string
          example: "Invitation accepted successfully, Your account is now created!"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          description: JWT authentication token valid for 7 days.
        user:
          type: object
          description: User details excluding password, including the new membership.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            provider:
              type: string
              nullable: true
            providerId:
              type: string
              nullable: true
            avatar:
              type: string
              format: uri
              nullable: true
            deletedAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            memberships:
              type: array
              items:
                $ref: "#/components/schemas/Membership"
        membership:
          $ref: "#/components/schemas/Membership"
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        businessId:
          type: string
          format: uuid
        role:
          type: string
          enum: [admin, staff]
        createdAt:
          type: string
          format: date-time

paths:
  /api/invitation/send:
    post:
      tags: [Invitations]
      summary: Send an invitation
      description: >
        Sends an invitation email to a user to join the business with a specific role.
        The recipient receives a unique token to accept or decline the invitation.
        Admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInvitationInput"
      responses:
        "201":
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invitation sent successfully"
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum: [admin, staff]
                      status:
                        type: string
                        example: "pending"
                      expiresAt:
                        type: string
                        format: date-time
        "400":
          description: Bad request (missing or invalid email)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "500":
          description: Internal server error
  /api/invitation/accept:
    post:
      tags: [Invitations]
      summary: Accept an invitation
      description: >
        Accepts an invitation using the token from the invitation email.
        Creates a new user account with the provided name and password.
        Returns a JWT token for authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationInput"
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The raw invitation token from the invitation email.
      responses:
        "200":
          description: Invitation accepted successfully. Account created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcceptedInvitationResponse"
        "400":
          description: >
            Bad request. Possible errors:
            - "This invitation is invalid or has already been used"
            - "This invitation has expired"
            - "Name and password are required to create your account"
        "500":
          description: Internal server error
  /api/invitation/decline:
    post:
      tags: [Invitations]
      summary: Decline an invitation
      description: >
        Declines an invitation using the token from the invitation email.
        The invitation status is updated to 'declined'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineInvitationInput"
      responses:
        "200":
          description: Invitation declined successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invitation declined"
        "400":
          description: >
            Bad request. Possible errors:
            - "This invitation is invalid or has already been used"
            - "This invitation has expired"
        "500":
          description: Internal server error
  /api/invitation/revoke/{invitationId}:
    post:
      tags: [Invitations]
      summary: Revoke an invitation
      description: >
        Revokes a pending invitation. Only pending invitations can be revoked.
        Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: invitationId
          required: true
          schema:
            type: string
            format: uuid
          description: The ID of the invitation to revoke.
      responses:
        "200":
          description: Invitation revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Invitation revoked"
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: Invitation not found
        "400":
          description: Bad request (Only pending invitations can be revoked)
        "500":
          description: Internal server error
