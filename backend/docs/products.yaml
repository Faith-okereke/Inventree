components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "Wireless Mouse"
        description:
          type: string
          example: "Ergonomic wireless mouse with USB receiver."
        image:
          type: string
          format: url
          example: "https://example.com/images/mouse.png"
        sku:
          type: string
          example: "WM-1001"
        price:
          type: number
          format: decimal
          example: 29.99
        quantityInStock:
          type: integer
          example: 120
        supplierEmail:
          type: string
          format: email
          nullable: true
          example: "supplier@example.com"
        lowStockThreshold:
          type: integer
          minimum: 0
          example: 10
        lowStockAlertSentAt:
          type: string
          format: date-time
          nullable: true
          example: "2026-09-04T18:20:00.000Z"
    ProductInput:
      type: object
      required:
        - name
        - description
        - price
        - sku
        - image
      properties:
        name:
          type: string
          example: "Wireless Mouse"
        description:
          type: string
          example: "Ergonomic wireless mouse with USB receiver."
        price:
          type: number
          format: decimal
          example: 29.99
        sku:
          type: string
          example: "WM-1001"
        image:
          type: string
          format: url
          example: "https://example.com/images/mouse.png"
        quantityInStock:
          type: integer
          minimum: 0
          example: 120
        supplierEmail:
          type: string
          format: email
          nullable: true
          example: "supplier@example.com"
        lowStockThreshold:
          type: integer
          minimum: 0
          example: 10

paths:
  /api/products/all:
    get:
      tags: [Products]
      summary: List all products
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of products.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "401":
          description: Missing or invalid authorization token
        "500":
          description: Internal server error
  /api/products/search:
    get:
      tags: [Products]
      summary: Search products
      description: Search products by a query string.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          required: true
          schema:
            type: string
          description: The search query.
      responses:
        "200":
          description: Matching products.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "400":
          description: Bad request (missing search query)
        "401":
          description: Missing or invalid authorization token
        "500":
          description: Internal server error
  /api/products/create:
    post:
      tags: [Products]
      summary: Create a new product
      description: Creates a product. Admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Bad request (e.g., validation error, duplicate name or SKU)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "500":
          description: Internal server error
  /api/products/{id}:
    get:
      tags: [Products]
      summary: Get a product by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The product's UUID.
      responses:
        "200":
          description: The requested product.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Bad request (invalid UUID)
        "401":
          description: Missing or invalid authorization token
        "404":
          description: Product not found
        "500":
          description: Internal server error
    patch:
      tags: [Products]
      summary: Update a product
      description: Updates a product. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The product's UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          description: Bad request (e.g., validation error, duplicate name or SKU)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: Product not found
        "500":
          description: Internal server error
    delete:
      tags: [Products]
      summary: Delete a product
      description: Deletes a product. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The product's UUID.
      responses:
        "204":
          description: Product deleted successfully (no content)
        "400":
          description: Bad request (invalid UUID)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: Product not found
        "500":
          description: Internal server error
