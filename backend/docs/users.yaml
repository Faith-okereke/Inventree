components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        role:
          type: string
          enum: [admin, staff]
          example: "staff"
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserInput:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        password:
          type: string
          minLength: 8
          example: "Password123!"
        role:
          type: string
          enum: [admin, staff]
          example: "staff"
    UpdateUserInput:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "john.doe@example.com"
        role:
          type: string
          enum: [admin, staff]
          example: "admin"

paths:
  /api/users/all:
    get:
      tags: [Users]
      summary: List all users
      description: Returns all non-deleted users. Admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: A list of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "500":
          description: Internal server error
  /api/users/create:
    post:
      tags: [Users]
      summary: Create a new user
      description: Creates a user with a hashed password. Admin only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad request (e.g., validation error, email already in use)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "500":
          description: Internal server error
  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get a user by ID
      description: Returns a single non-deleted user. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      responses:
        "200":
          description: The requested user.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad request (invalid UUID)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: User not found
        "500":
          description: Internal server error
    patch:
      tags: [Users]
      summary: Update a user
      description: Updates a user's name, email, or role. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserInput"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad request (e.g., validation error, email already in use)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: User not found
        "500":
          description: Internal server error
    delete:
      tags: [Users]
      summary: Delete a user
      description: Soft-deletes a user by setting deletedAt. Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: The user's UUID.
      responses:
        "204":
          description: User deleted successfully (no content)
        "400":
          description: Bad request (invalid UUID)
        "401":
          description: Missing or invalid authorization token
        "403":
          description: Forbidden (requires admin role)
        "404":
          description: User not found
        "500":
          description: Internal server error
