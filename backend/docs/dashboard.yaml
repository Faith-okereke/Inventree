components:
  schemas:
    DashboardSummary:
      type: object
      properties:
        totalOrders:
          type: integer
          example: 1284
        totalRevenue:
          type: number
          format: decimal
          example: 84200.50
      required: [totalOrders, totalRevenue]
    DashboardTopProduct:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        name:
          type: string
          example: Industrial Widget A
        sku:
          type: string
          example: IW-1001
        totalQuantity:
          type: integer
          example: 842
      required: [productId, name, sku, totalQuantity]
    DashboardLowStockProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Titanium Fastener 10mm
        sku:
          type: string
          example: TF-1001
        quantityInStock:
          type: integer
          example: 2
      required: [id, name, sku, quantityInStock]
    DashboardData:
      type: object
      properties:
        summary:
          $ref: "#/components/schemas/DashboardSummary"
        ordersByStatus:
          type: object
          additionalProperties:
            type: integer
          example:
            pending: 25
            fulfilled: 65
            cancelled: 10
        topProducts:
          type: array
          items:
            $ref: "#/components/schemas/DashboardTopProduct"
        lowStockProducts:
          type: array
          items:
            $ref: "#/components/schemas/DashboardLowStockProduct"
      required: [summary, ordersByStatus, topProducts, lowStockProducts]

paths:
  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Get dashboard metrics
      description: Returns aggregated order and inventory metrics. Admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard metrics retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 200
                  data:
                    $ref: "#/components/schemas/DashboardData"
                required: [status, data]
        "401":
          description: Missing or invalid authorization token.
        "403":
          description: Forbidden (requires admin role).
        "500":
          description: Internal server error.
